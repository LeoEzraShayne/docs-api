name: Tencent Cloud upload test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      DEPLOY_DIR: docs-api-deploy-test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build application
        run: |
          npm ci
          npx prisma generate
          npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - name: Package build artifacts
        run: |
          tar -czf docs-api-build.tgz dist package.json package-lock.json prisma prisma.config.ts

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/tencent_cloud_key"
          chmod 600 "$HOME/.ssh/tencent_cloud_key"
          ssh-keyscan -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload build to Tencent Cloud test directory
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i "$HOME/.ssh/tencent_cloud_key" "$SERVER_USER@$SERVER_HOST" "mkdir -p ~/$DEPLOY_DIR/${GITHUB_SHA}"
          scp -i "$HOME/.ssh/tencent_cloud_key" docs-api-build.tgz "$SERVER_USER@$SERVER_HOST:~/$DEPLOY_DIR/${GITHUB_SHA}/"
          ssh -i "$HOME/.ssh/tencent_cloud_key" "$SERVER_USER@$SERVER_HOST" "cd ~/$DEPLOY_DIR/${GITHUB_SHA} && tar -xzf docs-api-build.tgz && printf '%s\n' '${GITHUB_SHA}' > DEPLOYED_COMMIT && ln -sfn '${GITHUB_SHA}' ~/$DEPLOY_DIR/current"
