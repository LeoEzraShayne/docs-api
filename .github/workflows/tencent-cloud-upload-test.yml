name: Deploy API to Tencent Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, tencent-cloud, docs-api-prod]
    env:
      APP_ROOT: /var/www/docs-api
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sync source on Tencent Cloud
        run: |
          test -d "$APP_ROOT"
          test -w "$APP_ROOT"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'coverage/' \
            --exclude '*.tsbuildinfo' \
            --exclude '.DS_Store' \
            ./ "$APP_ROOT/"

      - name: Build and restart on Tencent Cloud
        run: |
          APP_ROOT="$APP_ROOT" GITHUB_SHA="$GITHUB_SHA" bash "$APP_ROOT/sh/server-deploy.sh"

      - name: Clean runner workspace
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ] && [ -d "$RUNNER_TEMP" ]; then
            find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi
          if [ -n "${GITHUB_WORKSPACE:-}" ] && [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi
